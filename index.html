<style>
/* Layout: single centred column (max 720px); search → result card → market context. Phone-first: built to be opened from a poster QR. */
:root{

  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A20; --surface:#16252E; --ink:#E7EEF0; --muted:#9AAAB1; --line:#2A3B44;
  --navy:#9CC3D6; --c1:#5FA9B3; --c2:#FF5C77; --c3:#D3CDA0; --c4:#A9A9A9;
  --c1-soft:#173A3F; --c2-soft:#45182A; --c3-soft:#37351F; --c4-soft:#2C3236;

:root[data-theme="dark"]{
  --bg:#0F1A20; --surface:#16252E; --ink:#E7EEF0; --muted:#9AAAB1; --line:#2A3B44;
  --navy:#9CC3D6; --c1:#5FA9B3; --c2:#FF5C77; --c3:#D3CDA0; --c4:#A9A9A9;
  --c1-soft:#173A3F; --c2-soft:#45182A; --c3-soft:#37351F; --c4-soft:#2C3236;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;display:flex;flex-direction:column;gap:22px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,8vw,44px);line-height:1.02;margin:4px 0 6px;color:var(--navy);text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:56ch}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-shrink:0}
.lang button{border:0;background:transparent;color:var(--muted);font:600 12px var(--body);padding:6px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--navy);color:var(--bg)}
.search{position:relative}
.search label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
.search input{width:100%;font:500 18px var(--body);padding:14px 16px;border:2px solid var(--navy);border-radius:12px;background:var(--surface);color:var(--ink);outline:none}

.chips span{font-size:12px;color:var(--muted);margin-right:2px}

.chip:hover,.chip:focus-visible{border-color:var(--navy)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.verdict{display:inline-flex;align-items:center;gap:8px;font:600 13px var(--body);padding:6px 12px;border-radius:999px;align-self:flex-start}
.verdict::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.v-ok{background:var(--ok-soft);color:var(--ok)} .v-warn{background:var(--warn-soft);color:var(--warn)} .v-none{background:var(--none-soft);color:var(--none)}
.name{font-family:var(--display);font-size:32px;font-weight:700;line-height:1.05;margin:0}
.alt{color:var(--muted);font-size:13px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.cls{display:inline-block;font:700 12px var(--body);padding:3px 9px;border-radius:6px}
.k1{background:var(--c1-soft);color:var(--c1)} .k2{background:var(--c2-soft);color:var(--c2)} .k3{background:var(--c3-soft);color:var(--ink)} .k4{background:var(--c4-soft);color:var(--ink)}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.row dt{color:var(--muted)} .row dd{margin:0;font-weight:500}
.yes{color:var(--ok);font-weight:600} .no{color:var(--c2);font-weight:600}
.note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;margin:0}
.rankbar{position:relative;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.rankbar i{position:absolute;inset:0 auto 0 0;border-radius:5px}
h2{font-family:var(--display);font-size:22px;margin:0;color:var(--navy)}
.stack{display:flex;height:34px;border-radius:8px;overflow:hidden}
.stack div{display:flex;align-items:center;justify-content:center;font:600 12px var(--mono);color:#fff;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.grid button{border:0;border-radius:6px;padding:5px 9px;font:500 12.5px var(--body);cursor:pointer;color:var(--ink)}
.grid button:focus-visible,.chip:focus-visible,.lang button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.grid button.on{outline:2px solid var(--ink)}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
footer a{color:var(--c1)}
@media (max-width:480px){.row{grid-template-columns:1fr;gap:2px}.stat b{font-size:24px}.name{font-size:28px}}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

 en:{eyebrow:"REDIF 2026 · Open-source PBPK models",title:"Find your drug",

const ROMAN=["","I","II","III","IV"];
let lang="es", current=null, sel=-1;
try{const s=localStorage.getItem("lang"); if(s==="en"||s==="es") lang=s;}catch(e){}
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const ALL=[...DATA.inc.map(d=>({...d,kind:"inc"})),...DATA.exc.map(d=>({...d,kind:"exc"}))];
const $=id=>document.getElementById(id);
const TOTAL=DATA.inc.reduce((a,d)=>a+d.n,0);
const nm=d=>lang==="es"?d.es:d.en, alt=d=>lang==="es"?d.en:d.es;
function status(x){const t=T[lang]; if(!x) return `<span>${t.notListed}</span>`;
  let s=x.status==="expired"?t.expired:x.status==="suspended"?t.suspended:t.until+x.status;
  return (x.form?`<span style="color:var(--muted)">${t[x.form]} · </span>`:"")+s;}
function render(d){
  current=d; const t=T[lang], r=$("result");
  if(!d){r.innerHTML=`<span class="verdict v-none">${t.none}</span><p class="name">${esc($("q").value)}</p><p class="note">${t.noneTxt}</p>`;return;}
  if(d.kind==="exc"){r.innerHTML=`<span class="verdict v-warn">${t.warn}</span><div><p class="name">${nm(d)}</p><div class="alt">${alt(d)}</div></div><p class="note">${t.reasons[d.r]}</p>`;return;}
  const pct=lang==='es'?(d.n/TOTAL*100).toFixed(1).replace('.',',')+' ':(d.n/TOTAL*100).toFixed(1), max=DATA.inc[0].n;
  r.innerHTML=`<span class="verdict v-ok">${t.ok}</span>
  <div><p class="name">${nm(d)}</p><div class="alt">${alt(d)}</div></div>
  <div class="stats">
    <div class="stat"><b>${d.n}</b><span>${t.products}</span></div>
    <div class="stat"><b>#${d.rank}</b><span>${t.rank}</span></div>
    <div class="stat"><b>${pct}%</b><span>${t.share}</span></div>
  </div>
  <div class="rankbar" role="img" aria-label="${d.n} / ${max}"><i style="width:${d.n/max*100}%;background:var(--c${d.c})"></i></div>
  <dl class="rows">
    <div class="row"><dt>${t.bcs}</dt><dd><span class="cls k${d.c}">${t.cl}${ROMAN[d.c]}</span> <span style="color:var(--muted);font-weight:400">${t.cls[d.c]}</span></dd></div>
    <div class="row"><dt>${t.lc}</dt><dd>${status(d.lc)}</dd></div>
    <div class="row"><dt>${t.lm}</dt><dd>${status(d.lm)}</dd></div>
    <div class="row"><dt>${t.be}</dt><dd class="${d.be?"yes":"no"}">${d.be?t.yes:t.no}</dd></div>
  </dl>
  ${(lang==="es"?d.nes:d.nen)?`<p class="note">${lang==="es"?d.nes:d.nen}</p>`:""}
  ${d.c===2?`<p class="note" style="border-left:3px solid var(--c2)">${t.c2hint}</p>`:""}`;
  document.querySelectorAll("#all button").forEach(b=>b.classList.toggle("on",b.dataset.es===d.es));
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function matches(q){q=norm(q); if(!q) return [];
  return ALL.map(d=>{const a=norm(d.es),b=norm(d.en);const s=(a.startsWith(q)||b.startsWith(q))?0:(a.includes(q)||b.includes(q))?1:9;return [s,d]})
   .filter(x=>x[0]<9).sort((x,y)=>x[0]-y[0]||(y[1].n||0)-(x[1].n||0)).slice(0,8).map(x=>x[1]);}
function showSugg(){const list=matches($("q").value), u=$("sugg"); sel=-1;
  if(!list.length){u.hidden=true;$("q").setAttribute("aria-expanded","false");return;}
  u.innerHTML=list.map((d,i)=>`<li role="option" id="o${i}" aria-selected="false" data-i="${ALL.indexOf(d)}"><span>${nm(d)}</span><small>${d.kind==="inc"?T[lang].cl+ROMAN[d.c]+" · "+d.n:"—"}</small></li>`).join("");
  u.hidden=false;$("q").setAttribute("aria-expanded","true");}
function pick(d){$("sugg").hidden=true;$("q").setAttribute("aria-expanded","false");$("q").value=nm(d);render(d);}
$("q").addEventListener("input",showSugg);
$("q").addEventListener("keydown",e=>{const u=$("sugg"),items=[...u.querySelectorAll("li")];
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){if(u.hidden||!items.length)return;e.preventDefault();
    sel=(sel+(e.key==="ArrowDown"?1:-1)+items.length)%items.length;items.forEach((li,i)=>li.setAttribute("aria-selected",i===sel));$("q").setAttribute("aria-activedescendant","o"+sel);}
  else if(e.key==="Enter"){e.preventDefault();const m=matches($("q").value);
    if(sel>=0&&items[sel]) pick(ALL[+items[sel].dataset.i]); else if(m.length) pick(m[0]); else {u.hidden=true;render(null);}}
  else if(e.key==="Escape"){u.hidden=true;}});
$("sugg").addEventListener("mousedown",e=>{const li=e.target.closest("li");if(li){e.preventDefault();pick(ALL[+li.dataset.i]);}});
$("q").addEventListener("blur",()=>setTimeout(()=>{$("sugg").hidden=true},120));
function paint(){const t=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t[el.dataset.t]);
  $("q").placeholder=t.ph; $("l-es").setAttribute("aria-pressed",lang==="es"); $("l-en").setAttribute("aria-pressed",lang==="en");
  const q=["Quetiapina","Metformina","Atorvastatina","Omeprazol","Amoxicilina"].map(es=>ALL.find(d=>d.es===es));
  $("quick").innerHTML=`<span>${t.try}</span>`+q.map(d=>`<button class="chip" data-i="${ALL.indexOf(d)}">${nm(d)}</button>`).join("");
  const by=[1,2,3,4].map(c=>({c,n:DATA.inc.filter(d=>d.c===c).reduce((a,d)=>a+d.n,0),m:DATA.inc.filter(d=>d.c===c).length}));
  $("stack").innerHTML=by.map(b=>`<div style="flex:${b.n};background:var(--c${b.c})" title="${t.cl}${ROMAN[b.c]}: ${b.n}">${b.n>=60?b.n:""}</div>`).join("");
  $("stack").setAttribute("aria-label",by.map(b=>`${t.cl}${ROMAN[b.c]} ${b.n}`).join(", "));
  $("legend").innerHTML=by.map(b=>`<span><i style="background:var(--c${b.c})"></i>${t.cl}${ROMAN[b.c]} · ${b.n} · ${b.m} ${t.models}</span>`).join("");
  $("all").innerHTML=[...DATA.inc].sort((a,b)=>a.c-b.c||b.n-a.n).map(d=>`<button class="k${d.c}" data-es="${d.es}">${nm(d)} <span style="opacity:.7;font-family:var(--mono);font-size:11px">${d.n}</span></button>`).join("");
  if(current!==undefined){ if(current){ $("q").value=nm(current);} render(current);} }
$("quick").addEventListener("click",e=>{const b=e.target.closest("button");if(b)pick(ALL[+b.dataset.i]);});
$("all").addEventListener("click",e=>{const b=e.target.closest("button");if(b){pick(DATA.inc.map(d=>({...d,kind:"inc"})).find(d=>d.es===b.dataset.es));window.scrollTo({top:0,behavior:"smooth"});}});
function setLang(l){lang=l;try{localStorage.setItem("lang",l)}catch(e){};paint();}
$("l-es").onclick=()=>setLang("es");$("l-en").onclick=()=>setLang("en");
current=ALL.find(d=>d.es==="Quetiapina"); paint();
</script>
</body></html>
